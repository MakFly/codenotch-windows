[package]
name = "codenotch-gpui"
version = "0.1.3"
description = "Experimental native rewrite of CodeNotch with GPUI"
authors = ["Kev"]
license = "MIT"
repository = "https://github.com/MakFly/codenotch-windows"
publish = false
edition = "2021"

[[bin]]
name = "codenotch-gpui"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
