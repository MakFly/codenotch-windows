[package]
name = "codenotch"
description = "CodeNotch for Windows: AI subscription quotas in a screen-edge notch."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
codenotch-core.workspace = true
codenotch-engine.workspace = true
codenotch-platform.workspace = true
codenotch-ui-kit.workspace = true
codenotch-ui-notch.workspace = true
codenotch-ui-settings.workspace = true
codenotch-providers.workspace = true
codenotch-providers-extra.workspace = true
gpui.workspace = true
log.workspace = true

# Crate-local dependencies go below this line.
codenotch-notify.workspace = true
codenotch-activity.workspace = true
codenotch-teams.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Only for the test that (re)generates assets/codenotch.ico from the tray rasteriser.
png = "0.17"

[build-dependencies]
# Application icon + version resource (already in the lock file through gpui).
embed-resource = "3"
